openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Private, user-scoped cycle tracking and wellness API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bloom
    description: Authenticated Bloom wellness operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bloom/dashboard:
    get:
      operationId: getBloomDashboard
      tags: [bloom]
      summary: Get the authenticated user's dashboard summary
      responses:
        "200":
          description: Dashboard data derived from the user's saved records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/periods:
    get:
      operationId: listPeriods
      tags: [bloom]
      summary: List the authenticated user's period records
      responses:
        "200":
          description: Period records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPeriod
      tags: [bloom]
      summary: Record a period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodInput"
      responses:
        "201":
          description: Period record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/periods/{id}:
    patch:
      operationId: updatePeriod
      tags: [bloom]
      summary: Edit one of the authenticated user's period records
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodUpdate"
      responses:
        "200":
          description: Period record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePeriod
      tags: [bloom]
      summary: Delete one of the authenticated user's period records
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Period record deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bloom/journal:
    get:
      operationId: listJournalEntries
      tags: [bloom]
      summary: List the authenticated user's symptom journal entries
      responses:
        "200":
          description: Journal entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createJournalEntry
      tags: [bloom]
      summary: Save a symptom journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/journal/{id}:
    patch:
      operationId: updateJournalEntry
      tags: [bloom]
      summary: Edit one of the authenticated user's journal entries
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalUpdate"
      responses:
        "200":
          description: Journal entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteJournalEntry
      tags: [bloom]
      summary: Delete one of the authenticated user's journal entries
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Journal entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bloom/profile:
    get:
      operationId: getBloomProfile
      tags: [bloom]
      summary: Read the authenticated user's profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloomProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateBloomProfile
      tags: [bloom]
      summary: Save the authenticated user's profile preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloomProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/insights:
    get:
      operationId: getBloomInsights
      tags: [bloom]
      summary: Get transparent insights based on saved records
      responses:
        "200":
          description: Observations with supporting sample counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/export:
    get:
      operationId: exportBloomData
      tags: [bloom]
      summary: Export the authenticated user's saved Bloom data
      responses:
        "200":
          description: Portable copy of the user's saved Bloom data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bloom/account:
    delete:
      operationId: deleteBloomAccountData
      tags: [bloom]
      summary: Permanently delete the authenticated user's Bloom data
      responses:
        "204":
          description: Bloom profile and health records deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Flow:
      type: string
      enum: [spotting, light, medium, heavy]
    PeriodRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        endDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, startDate, endDate, flow, notes, createdAt, updatedAt]
    PeriodInput:
      type: object
      properties:
        startDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        endDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        notes:
          type: [string, "null"]
          maxLength: 2000
      required: [startDate]
    PeriodUpdate:
      type: object
      properties:
        startDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        endDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        notes:
          type: [string, "null"]
          maxLength: 2000
    JournalEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recordedOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        symptoms:
          type: array
          items:
            type: string
        pain:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
        mood:
          type: [string, "null"]
        energy:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        comfortActions:
          type: array
          items:
            type: string
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, recordedOn, symptoms, pain, mood, energy, flow, comfortActions, notes, createdAt, updatedAt]
    JournalInput:
      type: object
      properties:
        recordedOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        symptoms:
          type: array
          maxItems: 24
          items:
            type: string
            maxLength: 80
        pain:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
        mood:
          type: [string, "null"]
          maxLength: 40
        energy:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        comfortActions:
          type: array
          maxItems: 24
          items:
            type: string
            maxLength: 100
        notes:
          type: [string, "null"]
          maxLength: 4000
      required: [recordedOn]
    JournalUpdate:
      type: object
      properties:
        recordedOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        symptoms:
          type: array
          maxItems: 24
          items:
            type: string
            maxLength: 80
        pain:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
        mood:
          type: [string, "null"]
          maxLength: 40
        energy:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        flow:
          oneOf:
            - $ref: "#/components/schemas/Flow"
            - type: "null"
        comfortActions:
          type: array
          maxItems: 24
          items:
            type: string
            maxLength: 100
        notes:
          type: [string, "null"]
          maxLength: 4000
    BloomProfile:
      type: object
      properties:
        displayName:
          type: [string, "null"]
        timezone:
          type: string
        language:
          type: string
        averageCycleLength:
          type: [integer, "null"]
        averagePeriodLength:
          type: [integer, "null"]
        remindersEnabled:
          type: boolean
        preferredSupport:
          type: [string, "null"]
        favoriteComforts:
          type: array
          items:
            type: string
        dietaryRestrictions:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required: [displayName, timezone, language, averageCycleLength, averagePeriodLength, remindersEnabled, preferredSupport, favoriteComforts, dietaryRestrictions, allergies, updatedAt]
    ProfileInput:
      type: object
      properties:
        displayName:
          type: [string, "null"]
          maxLength: 80
        timezone:
          type: string
          maxLength: 80
        language:
          type: string
          maxLength: 16
        averageCycleLength:
          type: [integer, "null"]
          minimum: 15
          maximum: 60
        averagePeriodLength:
          type: [integer, "null"]
          minimum: 1
          maximum: 15
        remindersEnabled:
          type: boolean
        preferredSupport:
          type: [string, "null"]
          maxLength: 300
        favoriteComforts:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 80
        dietaryRestrictions:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 80
        allergies:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 80
      required: [timezone, language, remindersEnabled, favoriteComforts, dietaryRestrictions, allergies]
    Dashboard:
      type: object
      properties:
        currentCycleDay:
          type: [integer, "null"]
        nextPeriodEstimate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        estimateConfidence:
          type: string
          enum: [none, limited, variable, moderate]
        daysUntilEstimate:
          type: [integer, "null"]
        recentPeriods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodRecord"
        recentJournalEntries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        averageCycleLength:
          type: [integer, "null"]
        recordedCycleCount:
          type: integer
      required: [currentCycleDay, nextPeriodEstimate, estimateConfidence, daysUntilEstimate, recentPeriods, recentJournalEntries, averageCycleLength, recordedCycleCount]
    Insight:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        sampleSize:
          type: integer
        limitation:
          type: string
      required: [id, title, detail, sampleSize, limitation]
    DataExport:
      type: object
      properties:
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/BloomProfile"
        periods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodRecord"
        journalEntries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
      required: [exportedAt, profile, periods, journalEntries]

