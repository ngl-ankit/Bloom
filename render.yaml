services:
  - type: web
    name: bloom-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString

      - key: APP_URL
        value: https://bloom-web.onrender.com

      - key: SESSION_SECRET
        generateValue: true

      - key: AI_PROVIDER_BASE_URL
        sync: false

      - key: AI_PROVIDER_API_KEY
        sync: false

      - key: AI_PROVIDER_MODEL
        value: grok-3-mini

      - key: EMAIL_API_KEY
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: CRON_SECRET
        generateValue: true

      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: bloom-db
    plan: free
    databaseName: bloom
    user: bloom_user
    postgresMajorVersion: "16"
